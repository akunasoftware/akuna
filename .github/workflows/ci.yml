name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  workspace:
    name: Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Run workspace checks and tests
        run: nix develop --command bash -c './build/scripts/ws-check.sh && ./build/scripts/ws-test.sh && ./build/scripts/ws-parity.sh'

  package:
    name: Nix Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
          - arch: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Build packages
        run: nix build .#default
      - name: Build OCI image
        if: endsWith(matrix.arch, '-linux')
        run: nix build .#oci
