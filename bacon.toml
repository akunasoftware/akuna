default_job = "all"
wrap = false

env.RUSTC_WRAPPER = "sccache"

[jobs.all]
command = ["./build/scripts/ws-all.sh"]
need_stdout = true

[jobs.fix]
command = ["./build/scripts/ws-fix.sh"]
need_stdout = true

[jobs.check]
command = ["./build/scripts/ws-check.sh"]
need_stdout = true

[jobs.test]
command = ["./build/scripts/ws-test.sh"]
need_stdout = true

[jobs.serve]
command = [
  "cargo",
  "run",
  "-p",
  "akuna",
  "--",
  "--log-level",
  "trace",
  "serve"
]

[keybindings]
shift-a = "job:all"
shift-f = "job:fix"
shift-c = "job:check"
shift-t = "job:test"
shift-s = "job:serve"
