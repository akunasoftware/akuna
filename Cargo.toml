[workspace]
resolver = "3"
members = [
  "src-crates/app",
  "src-crates/core",
  "src-crates/ffi",
]

[workspace.package]
authors = ["Akuna Team"]
repository = "https://github.com/akunasoftware/akuna"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.0"

[workspace.dependencies]
# Workspace packages use one path declaration.
akuna-core = { path = "src-crates/core" }

# core foundational deps
anyhow = "1.0.102"
thiserror = "2.0.18"
# App, core, and bindings need Tokio's runtime, macros, filesystem, and sync APIs.
tokio = { version = "1.52.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
utoipa = "5.5.0"

# ML infra
tokenizers = "0.22.2"
onnx-ir = "0.21.0-pre.3"
protobuf = "3.7.2"
safetensors = "0.7.0"
burn = { version = "0.21.0", default-features = false, features = ["std"] }
burn-dispatch = { version = "0.21.0", default-features = false, features = ["webgpu", "flex", "std"] }
burn-store = { version = "0.21.0", default-features = false, features = ["std", "safetensors", "pytorch"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "ureq", "rustls-tls"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
wgpu = "29"
pollster = "0.4"

[workspace.lints.rust]
missing_docs = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"

[profile.dev]
lto = false
strip = false
opt-level = 0
codegen-units = 256

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"
