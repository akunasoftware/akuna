[package]
name = "akuna-core"
description = "Knowledge tooling library for extraction, embedding, and reranking."
authors.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
bench = false
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = []
full = [
  "detection",
  "embedding",
  "extraction",
  "ocr",
  "reranking"
]

# Module features
detection = ["ml", "dep:safetensors"]
embedding = ["ml", "dep:tokenizers"]
extraction = ["detection", "dep:tokio", "dep:pdf_oxide", "dep:office_oxide", "dep:rbook", "dep:quick-xml"]
ml = ["dep:burn", "dep:burn-dispatch", "dep:burn-flex", "dep:burn-store", "dep:hf-hub", "dep:wgpu", "dep:pollster"]
ocr = ["ml", "dep:image", "dep:safetensors", "dep:tokio", "dep:heif-oxide"]
reranking = ["ml", "dep:tokenizers"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# Core primitives (always compiled)
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = "1.8.5"
utoipa = { workspace = true }

# ML stack (detection, embedding, OCR, reranking)
burn = { workspace = true, optional = true }
# Single runtime-dispatched backend; wgpu (GPU) or flex (CPU) chosen by device.
burn-dispatch = { workspace = true, optional = true }
# Enable acceleration on the same Flex backend used by Dispatch, not a second runtime.
burn-flex = { version = "0.21.0", default-features = false, features = ["std", "simd", "rayon"], optional = true }
burn-store = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
image = { workspace = true, optional = true }
heif-oxide = { workspace = true, optional = true }
# Runtime GPU-adapter probe for auto backend selection.
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

# Extraction (document parsing)
tokio = { workspace = true, optional = true }
pdf_oxide = { version = "0.3.70", default-features = false, optional = true }
office_oxide = { version = "0.1.2", default-features = false, optional = true }
rbook = { version = "0.7.10", default-features = false, optional = true }
quick-xml = { version = "0.41.0", optional = true }

[build-dependencies]
onnx-ir = { workspace = true }
protobuf = { workspace = true }
safetensors = { workspace = true }

[dev-dependencies]
# Official Magika reference parity only; no ONNX Runtime in production builds.
magika = { version = "=1.1.0", default-features = false }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
