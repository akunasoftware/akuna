[project]
name = "ffi-parity"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "einops==0.8.0",
  "huggingface-hub>=0.36.2",
  "magika>=1.0.3",
  "numpy>=2.3,<2.4",
  "opencv-contrib-python>=4.10.0.84",
  "paddleocr>=3.7.0",
  "paddlepaddle>=3.3.1",
  "paddlex>=3.7.2",
  "pypdfium2>=5.11.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.4.0",
  "sentence-transformers==5.1.2",
  "shapely>=2.1.2",
  "torch==2.9.1",
  "transformers==4.57.3",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["bindings"]
